<text x="35" y="825" font-size="17" font-weight="700">Responsive and interaction plan</text><text x="35" y="860">Mobile: navigation moves above content; cards stack; task actions wrap; forms fit the viewport.</text><text x="35" y="891">Dialogs: project and task editors, validation feedback, pending state, and deletion confirmation.</text><text x="35" y="922">Data: demo service → browser storage; optional API transport → planned /api/v1 backend.</text></g></svg>
