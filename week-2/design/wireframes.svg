<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="970" viewBox="0 0 1260 970"><title>TaskNest Week 2 interface wireframes</title><desc>Three connected views: a public landing page, a dashboard with summary and projects, and a project detail page with filters, tasks, and editing controls. Narrow screens stack the regions and place navigation above the content.</desc><rect width="1260" height="970" fill="white"/><g font-family="Arial,sans-serif" fill="#262936"><text x="35" y="44" font-size="25" font-weight="700">TaskNest Week 2 frontend wireframes</text><text x="35" y="77" font-size="15">Landing → Dashboard → Project detail • Original implementation layout</text></g><g stroke="#999" fill="#f5f5f5" stroke-width="2"><rect x="35" y="120" width="370" height="660"/><rect x="445" y="120" width="370" height="660"/><rect x="855" y="120" width="370" height="660"/><rect x="50" y="138" width="340" height="50"/><rect x="50" y="205" width="160" height="225"/><rect x="228" y="205" width="162" height="225"/><rect x="50" y="453" width="340" height="50"/><rect x="50" y="527" width="100" height="147"/><rect x="170" y="527" width="100" height="147"/><rect x="290" y="527" width="100" height="147"/><rect x="50" y="695" width="340" height="64"/>
<rect x="460" y="138" width="67" height="620"/><rect x="545" y="138" width="252" height="50"/><rect x="545" y="207" width="252" height="85"/><rect x="545" y="315" width="72" height="90"/><rect x="635" y="315" width="72" height="90"/><rect x="725" y="315" width="72" height="90"/><rect x="545" y="430" width="252" height="50"/><rect x="545" y="505" width="116" height="206"/><rect x="681" y="505" width="116" height="206"/>
<rect x="870" y="138" width="67" height="620"/><rect x="955" y="138" width="252" height="50"/><rect x="955" y="207" width="252" height="85"/><rect x="955" y="315" width="252" height="70"/><rect x="955" y="407" width="252" height="75"/><rect x="955" y="505" width="252" height="170"/><rect x="955" y="699" width="252" height="59"/></g>
<g font-family="Arial,sans-serif" fill="#444" font-size="13"><text x="50" y="111" font-weight="700">01 Landing #/</text><text x="460" y="111" font-weight="700">02 Dashboard #/dashboard</text><text x="870" y="111" font-weight="700">03 Detail #/projects/:id</text><text x="64" y="168">Brand / Open workspace</text><text x="64" y="239">Hero heading</text><text x="64" y="276">Introduction</text><text x="64" y="371">Demo action →</text><text x="242" y="277">Illustrative</text><text x="242" y="302">project board</text><text x="64" y="484">Local demo explanation</text><text x="64" y="560">Projects</text><text x="181" y="560">Filters</text><text x="302" y="560">Progress</text><text x="64" y="730">Scope note / Footer</text>
